name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # The build never queries the database — every API route is dynamic and no
      # page fetches at build time — but Prisma requires a syntactically valid
      # URL to load the schema. This dummy value is never connected to.
      DATABASE_URL: postgresql://user:password@localhost:5432/praxis
      NEXTAUTH_SECRET: ci-placeholder-secret-not-used-at-runtime
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --include=dev is explicit rather than implied: CI runners may set
      # NODE_ENV=production, which makes npm omit devDependencies — and the
      # build needs tailwindcss, typescript, postcss and the Prisma CLI.
      - name: Install dependencies
        run: npm ci --include=dev

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
