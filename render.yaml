services:
  - type: web
    name: praxis-app
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm ci --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        sync: false

      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true

      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OLLAMA_BASE_URL
        sync: false
      - key: LLM_PROVIDER_ORDER
        value: openai,anthropic,gemini,ollama

      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false

      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false

      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: Praxis

      - key: CONTACT_INBOX_EMAIL
        sync: false

      - key: MONGODB_URL
        sync: false
      - key: MONGODB_DB_NAME
        value: praxis

      - key: CHROMA_HOST
        sync: false
      - key: CHROMA_PERSIST_DIR
        value: /chroma/chroma

      - key: REDIS_URL
        sync: false

      - key: STORAGE_QUOTA_MB
        value: "1024"
